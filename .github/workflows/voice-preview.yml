name: Build ElevenLabs voiced preview
on:
  workflow_dispatch:
jobs:
  render-voiced-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check API credential (without spending credits)
        shell: bash
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "Missing ELEVENLABS_API_KEY. Add it in GitHub Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
      - name: Install Remotion and dependencies
        run: npm install
      - name: Generate character voices (uses ElevenLabs credits)
        run: npm run voices
      - name: Check TypeScript
        run: npm run typecheck
      - name: Render MP4 with synchronized voice clips
        run: npm run render
      - name: Balance dialogue volume and limit peaks (broadcast-friendly)
        run: |
          ffmpeg -hide_banner -loglevel error -y -i out/soledeals-wifi.mp4 \
            -af "highpass=f=75,acompressor=threshold=-22dB:ratio=2.4:attack=8:release=100,loudnorm=I=-16:TP=-1.5:LRA=9" \
            -c:v copy -c:a aac -b:a 192k -movflags +faststart out/soledeals-wifi-mastered.mp4
      - name: Upload private video preview
        uses: actions/upload-artifact@v4
        with:
          name: soledeals-wifi-voiced-preview
          path: out/soledeals-wifi-mastered.mp4
          retention-days: 7
